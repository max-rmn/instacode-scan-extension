<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Instacode Scan</title>
  <style>
    body { width: 340px; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #0A0B0E; color: #F2F3F5; }
    h1 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -0.01em; }
    h1 img { width: 20px; height: 20px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; color: #9DA1AC; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; background: #0E0F13; color: #F2F3F5; }
    input:focus { outline: none; border-color: rgba(94,106,210,0.55); box-shadow: 0 0 0 3px rgba(94,106,210,0.28); }
    input[type=password] { font-family: ui-monospace, monospace; }
    input::placeholder { color: #6E727C; }
    button { cursor: pointer; border: none; border-radius: 6px; padding: 9px 12px; font-size: 13px; font-weight: 600; font-family: inherit; }
    #scan { width: 100%; margin-top: 14px; background: #5E6AD2; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 4px 16px rgba(94,106,210,0.35); transition: background .15s; }
    #scan:hover:not(:disabled) { background: #535EBD; }
    #scan:disabled { background: rgba(94,106,210,0.4); cursor: default; }
    #stop { width: 100%; margin-top: 8px; background: rgba(255,255,255,0.06); color: #F2F3F5; border: 1px solid rgba(255,255,255,0.08); display: none; }
    #stop:hover { background: rgba(255,255,255,0.1); }
    .status { margin-top: 12px; font-size: 12px; color: #9DA1AC; }
    #counts { font-weight: 700; min-height: 16px; color: #F2F3F5; }
    #progress { min-height: 16px; white-space: pre-wrap; word-break: break-word; }
    .err { color: #F87171; }
    .ok { color: #34D399; }
    .note { font-size: 11px; color: #6E727C; margin-top: 8px; line-height: 1.35; }
    code { font-family: ui-monospace, monospace; color: #8A94F0; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="">Instacode Scan</h1>

  <label for="panelUrl">URL du panneau</label>
  <input id="panelUrl" type="text" spellcheck="false" placeholder="https://instacode-panel.onrender.com">

  <label for="token">Jeton de scan (X-Scan-Token)</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="Colle ton jeton…">
  <div class="note">Jeton récupéré dans le dashboard du panneau (endpoint GET <code>/api/scan/token</code>). Il est stocké uniquement en local (stockage local de l'extension).</div>

  <button id="scan">Scanner mes abonnés</button>
  <button id="stop">Arrêter</button>

  <div class="status">
    <div id="counts"></div>
    <div id="progress"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
